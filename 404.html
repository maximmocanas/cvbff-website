<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — CvBFF</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f9f9fb; color: #1a1a1a;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: #fff; border: 1px solid #e8e8e8;
      border-radius: 16px; padding: 48px 40px;
      text-align: center; max-width: 400px; width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
    }
    .icon {
      width: 64px; height: 64px; border-radius: 50%;
      background: #EEF1FE; display: flex; align-items: center;
      justify-content: center; margin: 0 auto 24px;
    }
    .icon svg { width: 30px; height: 30px; color: #4F6EF7; }
    .code { font-size: 13px; font-weight: 600; letter-spacing: .08em;
            text-transform: uppercase; color: #4F6EF7; margin-bottom: 10px; }
    h1 { font-size: 22px; font-weight: 750; letter-spacing: -0.01em; margin-bottom: 10px; }
    p { font-size: 15px; color: #6b6b6b; line-height: 1.6; margin-bottom: 28px; }
    .btn {
      display: inline-block; background: #4F6EF7; color: #fff;
      font: 600 15px/1 inherit; border-radius: 8px;
      padding: 13px 24px; text-decoration: none;
      transition: background 0.15s;
    }
    .btn:hover { background: #3B57D9; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
      </svg>
    </div>
    <div class="code">Error 404</div>
    <h1>Page not found</h1>
    <p>That page doesn't exist — it may have moved, or the link was mistyped. Let's get you back on track.</p>
    <a href="/" class="btn">Back to CvBFF</a>
  </div>
</body>
</html>
