<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CvBFF — My Applications</title>
  <link rel="stylesheet" href="/app/styles.css">
</head>
<body>
  <main class="app-main">
  <div class="wrap">
    <header class="masthead apps-masthead">
      <div>
        <h1>My Applications</h1>
        <p>Your saved CVs and cover letters. Click any card to open.</p>
      </div>
      <a href="/app/generate.html" class="btn btn-accent apps-gen-btn">+ Generate CV</a>
    </header>

    <!-- Stats strip -->
    <div id="appsStats" class="apps-stats" style="display:none">
      <div class="apps-stat-card">
        <div class="apps-stat-label">TOTAL APPLIED</div>
        <div class="apps-stat-value" id="statTotal">0</div>
        <div class="apps-stat-sub" id="statTotalSub"></div>
      </div>
      <div class="apps-stat-card">
        <div class="apps-stat-label">INTERVIEWS</div>
        <div class="apps-stat-value apps-stat-green" id="statInterviews">0</div>
        <div class="apps-stat-sub" id="statInterviewsSub"></div>
      </div>
      <div class="apps-stat-card">
        <div class="apps-stat-label">OFFERS</div>
        <div class="apps-stat-value apps-stat-green" id="statOffers">0</div>
        <div class="apps-stat-sub" id="statOffersSub"></div>
      </div>
      <div class="apps-stat-card">
        <div class="apps-stat-label">AVG FIT SCORE</div>
        <div class="apps-stat-value" id="statAvgScore">—</div>
        <div class="apps-stat-sub">Across all CVs</div>
      </div>
    </div>

    <div id="appsStatus" class="apps-status">
      <div class="spinner"></div>
      <p id="appsStatusText">Loading your applications…</p>
    </div>

    <div id="appsEmpty" class="apps-empty" style="display:none">
      <p>No saved applications yet.<br>Generate a CV and click <strong>Save</strong>.</p>
    </div>

    <div id="appsToolbar" class="apps-toolbar" style="display:none">
      <div class="apps-filters">
        <button class="filter-pill filter-active" data-filter="all">All</button>
        <button class="filter-pill" data-filter="applied">Applied</button>
        <button class="filter-pill" data-filter="interview">Interview</button>
        <button class="filter-pill" data-filter="offer">Offer</button>
        <button class="filter-pill" data-filter="rejected">Rejected</button>
      </div>
      <select id="appsSortSelect" class="apps-sort-select">
        <option value="newest">Newest first</option>
        <option value="score">Best score</option>
      </select>
    </div>

    <div id="appsList" class="apps-list" style="display:none"></div>
  </div>

  <script src="/app/config.js"></script>
  <script src="/app/app.js"></script>
  <script src="/app/supabase-api.js"></script>
  <script src="/app/applications.js"></script>
  </main>
</body>
</html>
