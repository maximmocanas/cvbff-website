<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CvBFF — Signing in…</title>
  <link rel="stylesheet" href="/app/styles.css">
</head>
<body>
  <div class="auth-callback-wrap">
    <div class="spinner" style="border-top-color:#fff; border-color:rgba(255,255,255,0.3)"></div>
    <p>Signing you in…</p>
  </div>

  <script src="/app/config.js"></script>
  <script src="/app/app.js"></script>
  <script src="/app/supabase-api.js"></script>
  <script>
    (async () => {
      try {
        // Supabase returns tokens in the URL hash fragment after OAuth redirect.
        const hash   = window.location.hash.slice(1);
        const params = new URLSearchParams(hash);
        const access_token  = params.get("access_token");
        const refresh_token = params.get("refresh_token") || "";
        const expires_in    = parseInt(params.get("expires_in") || "3600", 10);

        if (!access_token) throw new Error("No access token in callback URL.");

        // Store session.
        await store.set({
          supabaseSession: {
            access_token,
            refresh_token,
            expires_at: Math.floor(Date.now() / 1000) + expires_in,
          }
        });

        // Load and cache profile.
        try {
          const profile = await loadProfile();
          if (profile) {
            await store.set({ profile });
          } else {
            await store.set({ showOnboarding: true });
          }
        } catch { /* non-critical */ }

        location.href = "/app/applications.html";
      } catch (err) {
        document.querySelector(".auth-callback-wrap p").textContent =
          "Sign-in failed: " + err.message + " — redirecting…";
        setTimeout(() => { location.href = "/app/auth.html"; }, 2500);
      }
    })();
  </script>
</body>
</html>
