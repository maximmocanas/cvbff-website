<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CvBFF — Sign in</title>
  <link rel="stylesheet" href="/app/styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-brand">
      <span class="auth-brand-name">CvBFF</span>
    </div>

    <div class="auth-card">
      <p class="auth-card-title" id="authTitle">Sign in</p>

      <div class="auth-form">
        <p class="auth-error" id="authError" style="display:none"></p>

        <div class="auth-field">
          <input type="email" id="authEmail" placeholder="Email address" autocomplete="email">
        </div>

        <div class="auth-field auth-field-pw" id="pwWrap">
          <input type="password" id="authPassword" placeholder="Password" autocomplete="current-password">
          <button type="button" class="auth-pw-toggle" id="authPwToggle" aria-label="Show/hide password">
            <svg id="authPwEye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>

        <button type="button" class="auth-forgot" id="authForgot">Forgot password?</button>

        <p class="auth-forgot-success" id="forgotSuccess" style="display:none"></p>

        <button type="button" class="btn-auth-primary" id="authSubmit">Sign in</button>

        <div class="auth-divider" id="authDivider">or</div>

        <button type="button" class="btn-google" id="authGoogle">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Continue with Google
        </button>

        <p class="auth-toggle">
          <span id="authToggleText">Don't have an account?</span>
          <button type="button" class="auth-toggle-btn" id="authToggle">Sign up</button>
        </p>
      </div>
    </div>
  </div>

  <script src="/app/config.js"></script>
  <script src="/app/app.js"></script>
  <script src="/app/supabase-api.js"></script>
  <script>
    let isSignUp = false;
    let isForgot = false;

    const _EMAIL_RE = /^[^\s@]{1,64}@[^\s@]{1,255}\.[^\s@]{2,}$/;

    function setAuthError(msg) {
      const el = document.getElementById("authError");
      el.textContent = msg;
      el.style.display = msg ? "" : "none";
    }

    function setAuthMode(mode) {
      if (mode === true)  mode = "signup";
      if (mode === false) mode = "signin";
      isForgot = mode === "forgot";
      isSignUp  = mode === "signup";

      const pwWrap    = document.getElementById("pwWrap");
      const divider   = document.getElementById("authDivider");
      const googleBtn = document.getElementById("authGoogle");
      const forgotEl  = document.getElementById("authForgot");
      const successEl = document.getElementById("forgotSuccess");

      if (isForgot) {
        document.getElementById("authTitle").textContent      = "Reset password";
        document.getElementById("authSubmit").textContent     = "Send reset link";
        document.getElementById("authToggleText").textContent = "";
        document.getElementById("authToggle").textContent     = "← Back to sign in";
        pwWrap.style.display    = "none";
        divider.style.display   = "none";
        googleBtn.style.display = "none";
        forgotEl.style.display  = "none";
        successEl.style.display = "none";
        document.getElementById("authSubmit").style.display = "";
      } else {
        document.getElementById("authTitle").textContent      = isSignUp ? "Sign up" : "Sign in";
        document.getElementById("authSubmit").textContent     = isSignUp ? "Sign up" : "Sign in";
        document.getElementById("authToggleText").textContent = isSignUp ? "Already have an account?" : "Don't have an account?";
        document.getElementById("authToggle").textContent     = isSignUp ? "Sign in" : "Sign up";
        document.getElementById("authPassword").autocomplete  = isSignUp ? "new-password" : "current-password";
        forgotEl.style.display  = isSignUp ? "none" : "";
        pwWrap.style.display    = "";
        divider.style.display   = "";
        googleBtn.style.display = "";
        successEl.style.display = "none";
        document.getElementById("authSubmit").style.display = "";
      }
      setAuthError("");
    }

    document.getElementById("authToggle").addEventListener("click", () => {
      if (isForgot) setAuthMode("signin");
      else setAuthMode(!isSignUp);
    });

    document.getElementById("authForgot").addEventListener("click", () => setAuthMode("forgot"));

    document.getElementById("authPwToggle").addEventListener("click", () => {
      const input = document.getElementById("authPassword");
      const eye   = document.getElementById("authPwEye");
      const show  = input.type === "password";
      input.type  = show ? "text" : "password";
      eye.innerHTML = show
        ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`
        : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
    });

    document.getElementById("authSubmit").addEventListener("click", async () => {
      const email    = document.getElementById("authEmail").value.trim();
      const password = document.getElementById("authPassword").value;
      const btn      = document.getElementById("authSubmit");

      if (isForgot) {
        if (!email)               return setAuthError("Please enter your email address.");
        if (!_EMAIL_RE.test(email)) return setAuthError("Please enter a valid email address.");
        btn.disabled = true;
        btn.textContent = "Sending…";
        setAuthError("");
        try {
          await forgotPassword(email);
          btn.style.display = "none";
          const successEl = document.getElementById("forgotSuccess");
          successEl.textContent = `Reset link sent — check your inbox for ${email}.`;
          successEl.style.display = "";
        } catch (err) {
          setAuthError(err.message);
          btn.disabled = false;
          btn.textContent = "Send reset link";
        }
        return;
      }

      if (!email || !password) return setAuthError("Please enter your email and password.");
      if (!_EMAIL_RE.test(email)) return setAuthError("Please enter a valid email address.");
      if (password.length < 6)   return setAuthError("Password must be at least 6 characters.");
      if (password.length > 128) return setAuthError("Password must be 128 characters or fewer.");

      btn.disabled = true;
      btn.textContent = isSignUp ? "Creating account…" : "Signing in…";
      setAuthError("");

      try {
        if (isSignUp) {
          await signUp(email, password);
          await store.set({ showOnboarding: true }).catch(() => {});
        } else {
          await signIn(email, password);
        }
        // Load profile from Supabase after sign-in.
        try {
          const profile = await loadProfile();
          if (profile) await store.set({ profile });
        } catch { /* non-critical */ }
        location.href = "/app/generate.html";
      } catch (err) {
        setAuthError(err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = isSignUp ? "Sign up" : "Sign in";
      }
    });

    ["authEmail", "authPassword"].forEach(id => {
      document.getElementById(id).addEventListener("keydown", e => {
        if (e.key === "Enter") document.getElementById("authSubmit").click();
      });
    });

    document.getElementById("authGoogle").addEventListener("click", async () => {
      const btn = document.getElementById("authGoogle");
      btn.disabled = true;
      setAuthError("");
      try {
        await signInWithGoogle(); // redirects — never resolves
      } catch (err) {
        setAuthError(err.message);
        btn.disabled = false;
      }
    });

    // Redirect if already signed in.
    (async () => {
      const user = await getUser();
      if (user?.email) {
        try {
          await ensureSession();
          location.href = "/app/generate.html";
        } catch { /* session invalid — stay on auth page */ }
      }
    })();
  </script>
</body>
</html>
