<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment cancelled — CvBFF</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f9f9fb; color: #1a1a1a;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: #fff; border: 1px solid #e8e8e8;
      border-radius: 16px; padding: 48px 40px;
      text-align: center; max-width: 400px; width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
    }
    .icon {
      width: 64px; height: 64px; border-radius: 50%;
      background: #f4f3ef; display: flex; align-items: center;
      justify-content: center; margin: 0 auto 24px; font-size: 30px;
    }
    h1 { font-size: 22px; font-weight: 750; letter-spacing: -0.01em; margin-bottom: 10px; }
    p { font-size: 15px; color: #6b6b6b; line-height: 1.6; margin-bottom: 28px; }
    .btn {
      display: inline-block; background: #4F6EF7; color: #fff;
      font: 600 15px/1 inherit; border-radius: 8px;
      padding: 13px 24px; text-decoration: none;
      transition: background 0.15s;
    }
    .btn:hover { background: #3B57D9; }
    .note { margin-top: 16px; font-size: 13px; color: #9a9a9a; }

  <div class="card">
