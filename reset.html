<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset your password — CvBFF</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(160deg, #4F6EF7 0%, #3B57D9 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%; max-width: 400px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.18);
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 28px;
    }
    .brand-name {
      font-size: 20px; font-weight: 800; letter-spacing: -0.03em;
      color: #4F6EF7;
    }
    h1 {
      font-size: 20px; font-weight: 700; color: #1a1a1a;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 13.5px; color: #666; margin-bottom: 24px; line-height: 1.5;
    }
    label {
      display: block; font-size: 13px; font-weight: 600; color: #333;
      margin-bottom: 5px;
    }
    input[type="password"] {
      display: block; width: 100%;
      border: 1px solid #d0d5dd; border-radius: 8px;
      padding: 10px 12px; font-size: 14px;
      margin-bottom: 14px;
      transition: border-color 0.15s;
    }
    input[type="password"]:focus {
      outline: none; border-color: #4F6EF7;
      box-shadow: 0 0 0 3px rgba(79,110,247,0.15);
    }
    .btn {
      display: block; width: 100%; cursor: pointer;
      background: #4F6EF7; color: #fff;
      border: none; border-radius: 8px;
      padding: 11px 16px; font-size: 14px; font-weight: 700;
      letter-spacing: 0.01em;
      transition: background 0.12s ease;
    }
    .btn:hover:not(:disabled) { background: #3b57d9; }
    .btn:disabled { opacity: 0.6; cursor: default; }
    .msg {
      font-size: 13px; border-radius: 8px; padding: 10px 14px;
      margin-top: 14px; display: none;
    }
    .msg.error   { background: #fee2e2; color: #991b1b; }
    .msg.success { background: #dcfce7; color: #166534; }
    .return-link {
      display: block; text-align: center; margin-top: 18px;
      font-size: 13px; color: #4F6EF7; text-decoration: none;
    }
    .return-link:hover { text-decoration: underline; }
    .invalid-state { text-align: center; }
    .invalid-state p { font-size: 14px; color: #555; line-height: 1.6; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="32" height="32" aria-hidden="true">
        <rect width="128" height="128" rx="28" fill="#4F6EF7"/>
        <rect x="38" y="34" width="46" height="58" rx="6" fill="rgba(255,255,255,0.25)"/>
        <rect x="44" y="40" width="46" height="58" rx="6" fill="#fff"/>
        <rect x="52" y="54" width="30" height="3.5" rx="1.75" fill="#4F6EF7" opacity="0.3"/>
        <rect x="52" y="63" width="22" height="3.5" rx="1.75" fill="#4F6EF7" opacity="0.3"/>
        <rect x="52" y="72" width="26" height="3.5" rx="1.75" fill="#4F6EF7" opacity="0.3"/>
      </svg>
      <span class="brand-name">CvBFF</span>
    </div>

    <!-- Valid recovery token: show the form -->
    <div id="formState">
      <h1>Set a new password</h1>
      <p class="subtitle">Enter and confirm your new password below.</p>
      <form id="resetForm" novalidate>
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" placeholder="At least 8 characters" autocomplete="new-password" minlength="8">
        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" placeholder="Repeat your new password" autocomplete="new-password">
        <button type="submit" class="btn" id="submitBtn">Set password</button>
      </form>
      <div id="msg" class="msg"></div>
    </div>

    <!-- Invalid or missing token -->
    <div id="invalidState" class="invalid-state" style="display:none">
      <h1>Link expired</h1>
      <p class="subtitle">This password-reset link has expired or is invalid. Please request a new one from inside the CvBFF extension.</p>
    </div>

    <a href="https://cvbff.com" class="return-link">← Back to cvbff.com</a>
  </div>

  <script>
    const SUPABASE_URL  = "https://xmlvqzbhpdswkgrfqgiy.supabase.co";
    const SUPABASE_ANON = "sb_publishable_rk1qSQZvPZ-e6Ck_Y8hzDQ_fSq9f9j8";

    // Parse the URL fragment that Supabase appends after a recovery redirect.
    // Expected shape: #access_token=...&refresh_token=...&type=recovery&...
    const params = new URLSearchParams(window.location.hash.slice(1));
    const accessToken = params.get("access_token");
    const tokenType   = params.get("type");

    if (!accessToken || tokenType !== "recovery") {
      document.getElementById("formState").style.display   = "none";
      document.getElementById("invalidState").style.display = "";
    }

    function showMsg(text, type) {
      const el = document.getElementById("msg");
      el.textContent = text;
      el.className   = "msg " + type;
      el.style.display = "";
    }

    document.getElementById("resetForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const pw1 = document.getElementById("newPassword").value;
      const pw2 = document.getElementById("confirmPassword").value;
      const btn = document.getElementById("submitBtn");

      if (pw1.length < 8) {
        return showMsg("Password must be at least 8 characters.", "error");
      }
      if (pw1 !== pw2) {
        return showMsg("Passwords don't match — please try again.", "error");
      }

      btn.disabled     = true;
      btn.textContent  = "Saving…";
      document.getElementById("msg").style.display = "none";

      try {
        const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
          method:  "PUT",
          headers: {
            "Content-Type":  "application/json",
            "apikey":        SUPABASE_ANON,
            "Authorization": `Bearer ${accessToken}`,
          },
          body: JSON.stringify({ password: pw1 }),
        });

        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error_description || data.message || "Something went wrong — please try again.");
        }

        // Success — clear the form and show confirmation.
        document.getElementById("resetForm").style.display = "none";
        showMsg("✓ Password updated. You can now sign in to CvBFF with your new password.", "success");
      } catch (err) {
        showMsg(err.message, "error");
        btn.disabled    = false;
        btn.textContent = "Set password";
      }
    });
  </script>
</body>
</html>
